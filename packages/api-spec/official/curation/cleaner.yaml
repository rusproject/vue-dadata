version: 1
family: cleaner
operations:
  templateExpansions:
    - our:
        path: /clean/address
        method: post
      official:
        pathTemplate: '/clean/{type}'
        method: post

    - our:
        path: /clean/birthdate
        method: post
      official:
        pathTemplate: '/clean/{type}'
        method: post

    - our:
        path: /clean/email
        method: post
      official:
        pathTemplate: '/clean/{type}'
        method: post

    - our:
        path: /clean/name
        method: post
      official:
        pathTemplate: '/clean/{type}'
        method: post

    - our:
        path: /clean/passport
        method: post
      official:
        pathTemplate: '/clean/{type}'
        method: post

    - our:
        path: /clean/phone
        method: post
      official:
        pathTemplate: '/clean/{type}'
        method: post

    - our:
        path: /clean/vehicle
        method: post
      official:
        pathTemplate: '/clean/{type}'
        method: post

comparison:
  schemaComponentAliases:
    - target: official
      sourceName: Address
      canonicalName: AddressClean
    - target: official
      sourceName: AsIs
      canonicalName: AsIsClean
    - target: official
      sourceName: Birthdate
      canonicalName: DateClean
    - target: official
      sourceName: Email
      canonicalName: EmailClean
    - target: official
      sourceName: Name
      canonicalName: FioClean
    - target: official
      sourceName: Passport
      canonicalName: PassportClean
    - target: official
      sourceName: Phone
      canonicalName: PhoneClean
    - target: official
      sourceName: Vehicle
      canonicalName: VehicleClean

  anyOfSelections:
    - target: official
      operation:
        path: /clean/address
        method: post
      response:
        status: '200'
        mediaType: application/json
      schemaPath: items
      expectedBranchRefs:
        - '#/components/schemas/Address'
        - '#/components/schemas/AsIs'
        - '#/components/schemas/Birthdate'
        - '#/components/schemas/Email'
        - '#/components/schemas/Name'
        - '#/components/schemas/Passport'
        - '#/components/schemas/Phone'
        - '#/components/schemas/Vehicle'
      selectedRef: '#/components/schemas/Address'

    - target: official
      operation:
        path: /clean/birthdate
        method: post
      response:
        status: '200'
        mediaType: application/json
      schemaPath: items
      expectedBranchRefs:
        - '#/components/schemas/Address'
        - '#/components/schemas/AsIs'
        - '#/components/schemas/Birthdate'
        - '#/components/schemas/Email'
        - '#/components/schemas/Name'
        - '#/components/schemas/Passport'
        - '#/components/schemas/Phone'
        - '#/components/schemas/Vehicle'
